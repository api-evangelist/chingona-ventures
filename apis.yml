name: Chingona Ventures
description: 'Chingona Ventures is an early-stage venture capital firm that writes
  first institutional checks into pre-seed companies, typically investing $250,000
  to $2 million into founders building in industries that are massively changing.
  The firm concentrates on financial technology, the future of work, the future of
  learning, and health technology, backing founders with unique market positioning
  in large, often overlooked growth markets. Its portfolio spans 40+ companies including
  Finix, Hologram, Suma Wealth, Honey Homes, Connect Care Hero, and Boom Pay. This
  API Evangelist profile was originally surfaced as a venture-capital lead and has
  been enriched with firm identity and domain-security signals; the firm publishes
  no public API, so API-specific artifacts are not applicable.'
